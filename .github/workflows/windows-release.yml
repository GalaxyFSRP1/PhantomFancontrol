name: Build Windows release packages

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  package:
    name: Package MSI, setup EXE, and portable ZIP
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Install WiX and Inno Setup
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 4.*
          choco install innosetup --no-progress --yes
          "${env:ProgramFiles(x86)}\Inno Setup 6" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Restore, test, and package
        shell: pwsh
        run: |
          dotnet restore PhantomFanControl.sln
          dotnet test PhantomFanControl.sln -c Release --no-restore
          ./scripts/build-all.ps1

      - name: Upload release packages
        uses: actions/upload-artifact@v4
        with:
          name: PhantomFanControl-windows-x64
          path: |
            Release/PhantomFanControlSetup.exe
            Release/PhantomFanControl.msi
            Release/PhantomFanControl-Portable.zip
          if-no-files-found: error

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            Release/PhantomFanControlSetup.exe
            Release/PhantomFanControl.msi
            Release/PhantomFanControl-Portable.zip
